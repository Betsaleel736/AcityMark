{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flashes">
    {% for category, message in messages %}
      <div class="notice {{ {'success': 'ok', 'warning': 'warn', 'error': 'bad'}.get(category, 'info') }}" role="status">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
